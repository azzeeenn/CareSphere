<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery · CareSphere Admin</title>
  <link rel="stylesheet" href="../css/admin-base.css">
  <link rel="stylesheet" href="../css/admin-ui.css">
  <link rel="icon" type="image/png" sizes="32x32" href="../../../frontend/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="../../../frontend/favicon-16.png?v=2">
  <link rel="stylesheet" href="../css/admin-gallery.css">
</head>
<body class="admin" data-page="gallery" data-group="content">

  <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false">
    <i></i><i></i><i></i>
  </button>
  <div class="scrim" id="scrim"></div>

  <div class="admin-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="admin-main">
      <div class="admin-container">

        <header class="page-head">
          <div class="page-head-text">
            <a class="crumb" href="admin-home.html">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
              Admin Home
            </a>
            <h1>Gallery</h1>
            <p>Photos are resized before saving so the gallery stays fast to load.</p>
          </div>
          <button class="btn btn-primary" type="button" id="newPhoto">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Add photo
          </button>
        </header>

        <section class="summary-row" id="summaryRow"></section>

        <section class="toolbar">
          <label class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
            <input type="search" id="searchBox" placeholder="Search captions" aria-label="Search photos">
          </label>

          <select id="albumFilter" aria-label="Filter by album">
            <option value="all">All albums</option>
          </select>

          <select id="districtFilter" aria-label="Filter by district">
            <option value="all">All districts</option>
          </select>
        </section>

        <section class="photo-grid" id="grid"></section>

        <section class="table-wrap" id="emptyWrap" hidden>
          <div class="empty">
            <span class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m4 17 5-5 4.5 4.5L17 13l3 3"/></svg>
            </span>
            <h3 id="emptyTitle">No photos yet</h3>
            <p id="emptyBody">Add your first photo and give it a caption.</p>
          </div>
        </section>

      </div>
    </main>
  </div>

  <!-- Add / edit -->
  <div class="modal" id="formModal" role="dialog" aria-modal="true" aria-labelledby="formTitle">
    <div class="modal-box">
      <div class="modal-head">
        <div class="modal-head-text">
          <h2 id="formTitle">Add photo</h2>
          <p>JPG or PNG, up to 8 MB before resizing.</p>
        </div>
        <button class="modal-close" type="button" data-close-modal aria-label="Close">&times;</button>
      </div>

      <div class="modal-body">
        <div class="form-grid">

          <div class="field full" id="uploadField">
            <label>Photo</label>
            <label class="dropzone" id="dropzone">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M20 16v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3"/></svg>
              <strong>Choose a photo or drop one here</strong>
              <span id="dropHint">Nothing selected yet</span>
              <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp">
            </label>
            <span class="error" id="fileError"></span>
          </div>

          <div class="field full" id="previewField" hidden>
            <label>Preview</label>
            <div class="preview-frame"><img id="previewImg" alt=""></div>
            <span class="hint" id="previewNote"></span>
          </div>

          <div class="field full">
            <label for="gCaption">Caption</label>
            <input type="text" id="gCaption" placeholder="Sapling planting at Kukkarahalli Lake">
            <span class="error" id="gCaptionError"></span>
          </div>

          <div class="field">
            <label for="gAlbum">Album</label>
            <select id="gAlbum">
              <option value="Education">Education</option>
              <option value="Healthcare">Healthcare</option>
              <option value="Green Cover">Green Cover</option>
              <option value="Events">Events</option>
            </select>
          </div>

          <div class="field">
            <label for="gDistrict">District</label>
            <select id="gDistrict"></select>
          </div>

        </div>
      </div>

      <div class="modal-foot">
        <button class="btn btn-quiet spacer" type="button" data-close-modal>Cancel</button>
        <button class="btn btn-primary" type="button" id="savePhoto">Save photo</button>
      </div>
    </div>
  </div>

  <!-- Delete -->
  <div class="modal" id="deleteModal" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
    <div class="modal-box is-slim">
      <div class="modal-head">
        <div class="modal-head-text">
          <h2 id="deleteTitle">Delete this photo?</h2>
          <p id="deleteBody">It will be removed from the gallery page.</p>
        </div>
        <button class="modal-close" type="button" data-close-modal aria-label="Close">&times;</button>
      </div>
      <div class="modal-foot">
        <button class="btn btn-quiet spacer" type="button" data-close-modal>Keep it</button>
        <button class="btn btn-danger" type="button" id="confirmDelete">Delete photo</button>
      </div>
    </div>
  </div>

  <script src="../../../frontend/js/store.js"></script>
  <script src="../js/admin-shell.js"></script>
  <script src="../js/admin-gallery.js"></script>
</body>
</html>
