<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password | CareSphere</title>
<meta name="description" content="Reset the password for your CareSphere volunteer account.">

<link rel="stylesheet" href="../css/forgot-password.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="../favicon-16.png?v=2">
<link rel="stylesheet"
href="../css/icons.css">

<link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/theme.css">

</head>

<body>

<div class="login-container">

<div class="left-section">

<div class="overlay"></div>

<div class="content">

<i class="fa-solid fa-hand-holding-heart logo-icon" aria-hidden="true"></i>

<h1>CareSphere</h1>

<p>

Happens to everyone. Enter the email on your account and
we'll send you a link to set a new password.

</p>

</div>

</div>

<div class="right-section">

<div class="login-box">

<h2>Reset Password</h2>

<p class="subtitle">

We'll email you a reset link.

</p>

<p class="form-message" id="formMessage" role="status" aria-live="polite"></p>

<form id="resetForm" novalidate>

<div class="input-box">

<i class="fa-solid fa-envelope" aria-hidden="true"></i>

<label for="email" class="visually-hidden">Email address</label>

<input
type="email"
id="email"
name="email"
autocomplete="email"
placeholder="Email Address"
required>

</div>

<button type="submit">

Send Reset Link

</button>

<p class="register">

Remembered it?

<a href="login.html">

Back to Login

</a>

</p>

<p class="home">

<a href="index.html">

&larr; Back to Home

</a>

</p>

</form>

</div>

</div>

</div>

<script src="../js/site.js"></script>
<script src="../js/forgot-password.js"></script>

</body>

</html>
