<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volunteers · CareSphere Admin</title>
  <link rel="stylesheet" href="../css/admin-base.css">
  <link rel="stylesheet" href="../css/admin-ui.css">
  <link rel="icon" type="image/png" sizes="32x32" href="../../../frontend/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="../../../frontend/favicon-16.png?v=2">
</head>
<body class="admin" data-page="volunteers" data-group="people">

  <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false">
    <i></i><i></i><i></i>
  </button>
  <div class="scrim" id="scrim"></div>

  <div class="admin-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="admin-main">
      <div class="admin-container">

        <header class="page-head">
          <div class="page-head-text">
            <a class="crumb" href="admin-home.html">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
              Admin Home
            </a>
            <h1>Volunteers</h1>
            <p>Everyone whose application you approved. Deactivating blocks sign-in without deleting their record.</p>
          </div>
        </header>

        <section class="summary-row" id="summaryRow"></section>

        <section class="toolbar">
          <label class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
            <input type="search" id="searchBox" placeholder="Search by name or email" aria-label="Search volunteers">
          </label>

          <div class="filter-set" id="stateFilter" role="group" aria-label="Filter by account state">
            <button class="chip is-on" data-state="active">Active</button>
            <button class="chip" data-state="inactive">Deactivated</button>
            <button class="chip" data-state="all">All</button>
          </div>

          <select id="districtFilter" aria-label="Filter by district">
            <option value="all">All districts</option>
          </select>

          <select id="interestFilter" aria-label="Filter by interest">
            <option value="all">All interests</option>
          </select>
        </section>

        <section class="table-wrap">
          <div class="table-scroll">
            <table class="data">
              <thead>
                <tr>
                  <th>Volunteer</th>
                  <th>District</th>
                  <th>Interest</th>
                  <th>Events</th>
                  <th>Hours logged</th>
                  <th>Account</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div class="empty" id="emptyState" hidden>
            <span class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="3.2"/><path d="M22 20v-2a4 4 0 0 0-3-3.8"/></svg>
            </span>
            <h3 id="emptyTitle">No volunteers yet</h3>
            <p id="emptyBody">Approve an application and that person appears here.</p>
          </div>
        </section>

      </div>
    </main>
  </div>

  <div class="modal" id="profileModal" role="dialog" aria-modal="true" aria-labelledby="profileName">
    <div class="modal-box is-wide">
      <div class="modal-head">
        <div class="modal-head-text">
          <h2 id="profileName">—</h2>
          <p id="profileMeta">—</p>
        </div>
        <button class="modal-close" type="button" data-close-modal aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <dl class="detail-grid" id="profileGrid"></dl>
      </div>
      <div class="modal-foot" id="profileFoot"></div>
    </div>
  </div>

  <script src="../../../frontend/js/store.js"></script>
  <script src="../js/admin-shell.js"></script>
  <script src="../js/admin-volunteers.js"></script>
</body>
</html>
