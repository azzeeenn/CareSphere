<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAQ · CareSphere Admin</title>
  <link rel="stylesheet" href="../css/admin-base.css">
  <link rel="stylesheet" href="../css/admin-ui.css">
  <link rel="icon" type="image/png" sizes="32x32" href="../../../frontend/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="../../../frontend/favicon-16.png?v=2">
</head>
<body class="admin" data-page="faq" data-group="content">

  <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false">
    <i></i><i></i><i></i>
  </button>
  <div class="scrim" id="scrim"></div>

  <div class="admin-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="admin-main">
      <div class="admin-container">

        <header class="page-head">
          <div class="page-head-text">
            <a class="crumb" href="admin-home.html">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
              Admin Home
            </a>
            <h1>FAQ</h1>
            <p>The order here is the order on the public FAQ page.</p>
          </div>
          <button class="btn btn-primary" type="button" id="newFaq">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            New question
          </button>
        </header>

        <section class="summary-row" id="summaryRow"></section>

        <section class="toolbar">
          <label class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
            <input type="search" id="searchBox" placeholder="Search questions and answers" aria-label="Search FAQ">
          </label>

          <select id="categoryFilter" aria-label="Filter by category">
            <option value="all">All categories</option>
          </select>
        </section>

        <section class="table-wrap">
          <div class="table-scroll">
            <table class="data">
              <thead>
                <tr>
                  <th style="width:88px">Order</th>
                  <th>Question</th>
                  <th>Category</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div class="empty" id="emptyState" hidden>
            <span class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.4c-.7.3-1 .9-1 1.6v.3"/><path d="M12 17h.01"/></svg>
            </span>
            <h3 id="emptyTitle">No questions yet</h3>
            <p id="emptyBody">Add the questions people ask you most often.</p>
          </div>
        </section>

      </div>
    </main>
  </div>

  <div class="modal" id="formModal" role="dialog" aria-modal="true" aria-labelledby="formTitle">
    <div class="modal-box">
      <div class="modal-head">
        <div class="modal-head-text">
          <h2 id="formTitle">New question</h2>
          <p>Write the answer the way you would say it out loud.</p>
        </div>
        <button class="modal-close" type="button" data-close-modal aria-label="Close">&times;</button>
      </div>

      <div class="modal-body">
        <div class="form-grid">
          <div class="field full">
            <label for="qQuestion">Question</label>
            <input type="text" id="qQuestion" data-autofocus placeholder="Who can become a volunteer?">
            <span class="error" id="qQuestionError"></span>
          </div>
          <div class="field full">
            <label for="qAnswer">Answer</label>
            <textarea id="qAnswer" style="min-height:120px" placeholder="Anyone above 18 living in or near our six operating districts."></textarea>
            <span class="error" id="qAnswerError"></span>
          </div>
          <div class="field full">
            <label for="qCategory">Category</label>
            <select id="qCategory">
              <option value="Volunteering">Volunteering</option>
              <option value="Donations">Donations</option>
              <option value="Programmes">Programmes</option>
              <option value="General">General</option>
            </select>
          </div>
        </div>
      </div>

      <div class="modal-foot">
        <button class="btn btn-quiet spacer" type="button" data-close-modal>Cancel</button>
        <button class="btn btn-primary" type="button" id="saveFaq">Save question</button>
      </div>
    </div>
  </div>

  <div class="modal" id="deleteModal" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
    <div class="modal-box is-slim">
      <div class="modal-head">
        <div class="modal-head-text">
          <h2 id="deleteTitle">Delete this question?</h2>
          <p id="deleteBody">It will be removed from the FAQ page.</p>
        </div>
        <button class="modal-close" type="button" data-close-modal aria-label="Close">&times;</button>
      </div>
      <div class="modal-foot">
        <button class="btn btn-quiet spacer" type="button" data-close-modal>Keep it</button>
        <button class="btn btn-danger" type="button" id="confirmDelete">Delete question</button>
      </div>
    </div>
  </div>

  <script src="../../../frontend/js/store.js"></script>
  <script src="../js/admin-shell.js"></script>
  <script src="../js/admin-faq.js"></script>
</body>
</html>
